name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<10" "omegaconf>=2.3,<3" pydantic
      - name: Score release readiness
        run: python scripts/release_readiness.py --min-score 95
