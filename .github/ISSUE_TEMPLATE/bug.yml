name: Bug report
description: Report a reproducible Memora for OpenClaw problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials or private memory content. Redact logs.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: OpenClaw, memora-openclaw, Python, Ollama, and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps using synthetic or redacted data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
